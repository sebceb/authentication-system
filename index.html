<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yung Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>THeSt0re</h1>
            <div id="user-info">User: <span id="display-user">Guest</span></div>
            <button id="logout-btn" style="margin-left: 15px; padding: 0.3rem 0.8rem; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
        </div>
        
        <div class="header-right">
            <button id="cart-btn">Cart (<span id="cart-count">0</span>)</button>
    
            <div id="cart-modal" class="hidden">
                <div id="cart-items"></div>
                <div id="cart-total">Total: $0</div>
                <div id="checkout-status"></div>
                <button id="checkout-btn">Complete Purchase</button>
            </div>
        </div>
    </header>

    <section id="filters-bar" class="filters-container">
        <div class="filter-group price-filters">
            <label>Min Price: <input type="number" id="min-price" value="0"></label>
            <label>Max Price: <input type="number" id="max-price" value="1000"></label>
        </div>    
    </section>

    <main>
        <h2 id="current-category-title" style="text-align: center; color: #1a1a1a; margin-bottom: 2rem;"></h2>
        <section id="product-grid">
            </section>
    </main>

    

    <script type="module" src="js/app.js" ></script>
    
</body>
</html>
